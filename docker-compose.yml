# Local environment: `docker compose up --build` starts PostgreSQL and the API, then open http://localhost:8080/swagger-ui.html
# For development with the app running from your IDE or `./mvnw spring-boot:run`, start only the database:
#   docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: space-booking-db
    environment:
      POSTGRES_DB: spacebooking
      POSTGRES_USER: spacebooking
      POSTGRES_PASSWORD: spacebooking # local development only
    ports:
      # Loopback only: the development password must not be reachable from other machines on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacebooking -d spacebooking"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: space-booking-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The image defaults to the "prod" profile (JSON logs, JWT_SECRET mandatory). Locally we use the "local" profile,
      # which keeps readable logs and the development JWT secret from application.yml. Never deploy it that way.
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/spacebooking
      DB_USER: spacebooking
      DB_PASSWORD: spacebooking
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # Hardening: nothing to write except /tmp, no extra Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
