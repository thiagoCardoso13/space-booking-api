services:
  postgres:
    image: postgres:16-alpine
    container_name: space-booking-db
    environment:
      POSTGRES_DB: spacebooking
      POSTGRES_USER: spacebooking
      POSTGRES_PASSWORD: spacebooking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacebooking -d spacebooking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
