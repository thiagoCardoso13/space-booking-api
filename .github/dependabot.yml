version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project targets Java 21 (LTS); a new Java major is a deliberate decision, not an automatic bump.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
