name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Compiles, runs unit and integration tests (Testcontainers starts PostgreSQL) and enforces the JaCoCo coverage gate.
      - name: Build, test and check coverage
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write # publish the image to GitHub Container Registry
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds for the CI machine (linux/amd64) and keeps the image locally so it can be tested before being published.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: space-booking-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the real image against a real PostgreSQL with the production profile.
      - name: Smoke test the image
        run: .github/scripts/smoke-test.sh space-booking-api:ci

      # Publishing only happens on pushes to main, and only after the tests and the smoke test passed.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Asks Render to deploy the image that was just built, smoke tested and published (the commit tag, not "latest").
  # Only runs on pushes to main, after the tests and the image checks passed.
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    steps:
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "Deploying ghcr.io/thiagocardoso13/space-booking-api:${TAG}"
          curl -fsS -X POST "${HOOK}&imgURL=ghcr.io%2Fthiagocardoso13%2Fspace-booking-api%3A${TAG}"
