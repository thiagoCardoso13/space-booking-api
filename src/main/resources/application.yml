spring:
  data:
    web:
      pageable:
        max-page-size: 100
  application:
    name: space-booking-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spacebooking}
    username: ${DB_USER:spacebooking}
    password: ${DB_PASSWORD:spacebooking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    # Local development default only. Always override JWT_SECRET (at least 32 characters) outside local use.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    expiration: ${JWT_EXPIRATION:1h}
    issuer: space-booking-api
